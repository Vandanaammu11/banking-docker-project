apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-application
spec:
  replicas: 1
  selector:
    matchLabels:
        app: banking-application
  template:
    metadata:
     labels:
       app: banking-application
    spec:
      containers:
        - name: banking-application
          image: vandanaammu11/banking-app:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80



---
apiVersion: v1
kind: Service
metadata:
  name: banking-service
spec:
  type: NodePort
  selector:
    app: banking-application
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080



